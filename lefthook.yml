pre-commit:
  parallel: true
  commands:
    lint:
      run: pnpm lint
    verify-types:
      run: pnpm check-types
    test:
      run: pnpm test:run
pre-push:
  parallel: true
  commands:
    build:
      run: pnpm build
    lint:
      run: pnpm lint
    commit-lint:
      run: pnpm dlx commitlint --from=HEAD~1
commit-msg:
  commands:
    commit-lint:
      run: pnpm dlx commitlint --edit {0}
